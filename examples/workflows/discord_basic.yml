workflow:
  id: discord-notification-demo
  name: Discord Notification Demo
  description: Demonstrates Discord integration with interactive button components for alert notifications.
  triggers:
    - type: manual
  actions:
    - name: discord
      provider:
        type: discord
        config: "{{ providers.discordtest }}"
        with:
          content: Alerta!
          components:
            - type: 1 # Action row
              components:
                - type: 2 # Button
                  style: 1 # Primary style
                  label: "Click Me!"
                  custom_id: "button_click"

    - name: discord-embed
      provider:
        type: discord
        config: "{{ providers.discordtest }}"
        with:
          username: "Keep AlertBot"
          embeds:
            - title: "High CPU Usage"
              description: "Server web-01 is at 92% CPU"
              color: 16711680
              fields:
                - name: "Severity"
                  value: "Critical"
                - name: "Server"
                  value: "web-01"

    - name: discord-file
      provider:
        type: discord
        config: "{{ providers.discordtest }}"
        with:
          content: "CPU spike detected"
          files:
            # base64 is the only way to attach a file: it's how a chart or
            # log excerpt generated by an earlier step (returned as a
            # base64 string in that step's results) gets attached, without
            # ever touching the local filesystem.
            - base64: "{{ steps.render-chart.results.chart_base64 }}"
              filename: "cpu-spike.png"

    # wait: true makes Discord return the sent message so its id can be
    # reused by a later step to edit it.
    - name: discord-open-incident
      provider:
        type: discord
        config: "{{ providers.discordtest }}"
        with:
          content: "Investigating high CPU on web-01..."
          wait: true

    - name: discord-resolve-incident
      provider:
        type: discord
        config: "{{ providers.discordtest }}"
        with:
          message_id: "{{ steps.discord-open-incident.results.message_id }}"
          content: "Resolved: CPU back to normal on web-01."

