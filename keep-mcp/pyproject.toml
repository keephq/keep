[project]
name = "keep-mcp"
version = "0.1.0"
description = "MCP server (sidecar) exposing Keep alerts, incidents and topology to LLM clients"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
keep-mcp = "keep_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["keep_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
