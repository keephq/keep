name: Release Debug UI Image

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  debug-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read release version
        id: release
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["tool"]["poetry"]["version"]
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"commit={commit}", file=output)
              print(f"image=ghcr.io/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/keep-frontend", file=output)
          PY

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish UI with browser source maps
        uses: docker/build-push-action@v6
        with:
          context: keep-ui
          file: docker/Dockerfile.ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}-dev
          build-args: |
            KEEP_INCLUDE_SOURCES=true
            KEEP_VERSION=${{ steps.release.outputs.version }}-dev
            GIT_COMMIT_HASH=${{ steps.release.outputs.commit }}
          cache-from: type=gha,scope=debug-ui
          cache-to: type=gha,mode=max,scope=debug-ui
