name: Site24x7 tag parser
on:
  push:
    paths:
      - keep/providers/site24x7_provider/**
      - tests/providers/site24x7_provider/**
      - .github/workflows/site24x7-parser.yml
  pull_request:
    paths:
      - keep/providers/site24x7_provider/**
      - tests/providers/site24x7_provider/**
      - .github/workflows/site24x7-parser.yml
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/providers/site24x7_provider -p test_tag_parser.py -v
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.1.3
      - uses: actions/cache@v4
        with:
          path: .venv
          key: site24x7-py311-${{ hashFiles('poetry.lock') }}
      - run: poetry install --no-interaction --no-root --with dev
      - run: poetry run pytest tests/providers/site24x7_provider/test_site24x7_bugs.py --non-integration --timeout 20 -q
